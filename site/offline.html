<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline – Rajwadi Thali, Chaat &amp; Sweets</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#08080A">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
<!-- Deliberately self-contained: this page is the fallback for having no
     network, so it cannot depend on the stylesheet or the webfonts loading.
     The palette is the site's, hardcoded. -->
<style>
  :root {
    --gold: #d49b3a; --gold-light: #e8be72; --gold-ink: #8a5a0f;
    --bg: #f5f0e7; --ink: #1a1a1c; --gray: #616161;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 32px 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.65;
  }
  img { width: 96px; height: 96px; display: block; margin: 0 0 26px; }
  h1 {
    margin: 0 0 12px; font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700; letter-spacing: .01em; font-size: clamp(1.75rem, 6vw, 2.5rem);
    line-height: 1.14; color: var(--gold-ink);
  }
  p { margin: 0 0 26px; max-width: 46ch; color: #333; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a, button {
    font: inherit; font-weight: 600; font-size: .9rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 48px; padding: 12px 26px; border-radius: 100px; text-decoration: none;
  }
  .primary {
    color: #17120a; border: 1px solid rgba(255, 235, 190, .55);
    background: linear-gradient(135deg, rgba(212, 155, 58, .97), rgba(184, 122, 37, .94));
    box-shadow: 0 8px 28px rgba(184, 122, 37, .35);
  }
  .secondary { color: var(--gold-ink); background: rgba(212, 155, 58, .1); border: 1px solid rgba(212, 155, 58, .55); }
  .tel { margin-top: 26px; font-size: .92rem; color: var(--gray); }
  .tel a { display: inline; min-height: 0; padding: 0; color: var(--gold-ink); text-decoration: underline; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
  <img src="assets/img/icon-192.png" alt="Rajwadi Thali">
  <h1>You're offline</h1>
  <p>
    We can't reach the kitchen right now. Any page you've already visited will
    still open — reconnect and this one will load straight away.
  </p>
  <div class="row">
    <button class="primary" onclick="location.reload()">Try again</button>
    <a class="secondary" href="index.html">Go to home</a>
  </div>
  <p class="tel">
    Need us now? Call <a href="tel:+15108968976">(510) 896-8976</a>
  </p>
  <script>
    // come back on its own the moment the connection returns
    addEventListener('online', () => location.reload());
  </script>
</body>
</html>
